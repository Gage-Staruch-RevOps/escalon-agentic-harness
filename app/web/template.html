<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Harness</title>
<style>
:root{--bg:#131C40;--bg2:#1A2550;--panel:rgba(28,39,78,.82);--solid:#1B2752;--line:#33457F;--line2:#465A9A;--ink:#F3F6FF;--muted:#B4C0E2;--dim:#8291BC;
  --blue:#8EA9DB;--orange:#E97132;--gold:#FFC000;--teal:#7DD3C7;--ok:#5FD08A;--bad:#FF6B6B;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;
  --ease-out:cubic-bezier(0.23,1,0.32,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font:400 13px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none;cursor:default}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid rgba(255,255,255,.7);outline-offset:2px}
kbd{font:600 10px/1 var(--font);border:1px solid var(--line2);border-radius:4px;padding:2px 5px;color:var(--muted)}
#stage{position:fixed;inset:0;background:radial-gradient(1300px 900px at 50% 45%,#2A3B80 0%,#1C2960 50%,#131C44 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}

/* top bar */
.top{position:fixed;left:14px;right:14px;top:12px;height:44px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;z-index:5}
.top h1{font:650 14px/1 var(--font);margin:0;letter-spacing:.01em}
.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;padding-left:10px;border-left:1px solid var(--line)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.status.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.status.busy i{background:var(--orange);box-shadow:0 0 8px var(--orange)}
.search{margin:0 auto;display:flex;align-items:center;gap:8px;width:min(420px,38vw);height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);cursor:text}
.search span{flex:1;text-align:left}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap;transition:transform 160ms var(--ease-out),background-color 140ms ease,border-color 140ms ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#081027}
.btn.ghost{border-color:transparent}
.btn.sm{height:24px;padding:0 8px;font-size:11px;border-radius:6px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
@media (hover:hover){.btn:hover:not(:disabled){background:rgba(255,255,255,.09)}.btn.primary:hover:not(:disabled){background:#A7BDE6}}
.logo svg{display:block;width:92px;height:25px;opacity:.9}
.wordmark{font:700 13px var(--font);letter-spacing:.2em}

/* popover */
.pop{position:fixed;top:62px;right:14px;width:280px;max-height:calc(100vh - 80px);overflow:auto;padding:12px;z-index:6;display:none}
.pop.on{display:block}
.caps{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:12px 0 6px}
.caps:first-child{margin-top:0}
.layer{display:flex;align-items:center;gap:9px;padding:4px 6px;margin:0 -6px;border-radius:6px;cursor:pointer}
.layer.off{opacity:.35}
.layer i{width:9px;height:9px;border-radius:50%;flex:none}
.layer .n{margin-left:auto;color:var(--dim);font-size:11px}
@media (hover:hover){.layer:hover{background:rgba(255,255,255,.06)}}
.row{display:flex;gap:6px;flex-wrap:wrap}
.tog{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
.tog input{accent-color:var(--blue);margin:0}

/* activity (left) */
.mission{position:fixed;left:14px;top:68px;width:320px;max-height:calc(100vh - 150px);display:flex;flex-direction:column;z-index:4;overflow:hidden;transition:opacity 200ms var(--ease-out)}
.mission header{display:flex;align-items:center;gap:8px;padding:11px 14px 9px;border-bottom:1px solid var(--line)}
.mission header b{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.mission .body{overflow:auto;padding:12px 14px 14px}
.now{display:flex;gap:10px;align-items:flex-start}
.orb{width:26px;height:26px;border-radius:50%;flex:none;position:relative;background:radial-gradient(circle at 35% 30%,#fff 0,#FFE08A 22%,#FFC000 46%,rgba(255,192,0,0) 72%)}
.orb.idle{background:radial-gradient(circle at 35% 30%,#C9D4F2 0,#6E7FB0 40%,rgba(110,127,176,0) 72%)}
.orb.think{animation:breathe 1.6s ease-in-out infinite}.orb.act{animation:breathe .8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.18);opacity:.75}}
.now .t{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.now .t.idle{color:var(--dim)}
.now .l{font:600 14px/1.3 var(--font);margin-top:1px;word-break:break-word}
.now .s{color:var(--muted);font-size:12px;margin-top:2px}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,var(--orange),var(--gold));transition:width 500ms var(--ease-out)}
.bar.run>i{width:38%!important;animation:slide 1.15s cubic-bezier(.65,0,.35,1) infinite;transition:none}
.bar.ok>i{background:var(--ok)}
@keyframes slide{0%{left:-40%}100%{left:102%}}
.overall{margin-top:14px}
.overall .h{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px}
.overall .bar{height:6px;border-radius:3px}
.tasks{list-style:none;margin:12px 0 0;padding:0}
.tasks li{padding:7px 0;border-top:1px solid rgba(255,255,255,.05)}
.tasks .r{display:flex;gap:8px;align-items:center;font-size:12.5px}
.tasks .ic{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;font-size:9px;line-height:1}
.tasks li.done .ic{background:var(--ok);border-color:var(--ok);color:#06210F}
.tasks li.run .ic{background:radial-gradient(circle,var(--gold) 0 38%,transparent 42%)}
.tasks li.done .r span{color:var(--muted)}
.tasks li.pend .r span{color:var(--dim)}
.tasks .m{margin-left:auto;color:var(--dim);font-size:11px;white-space:nowrap}
.tasks .bar{margin:6px 0 0 22px}
.acts{list-style:none;margin:12px 0 0;padding:0}
.acts li{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:12px;color:var(--muted);transition:opacity 220ms var(--ease-out),transform 220ms var(--ease-out)}
@starting-style{.acts li.new{opacity:0;transform:translateY(-5px)}}
.acts li i{width:6px;height:6px;border-radius:50%;flex:none;background:var(--dim)}
.acts li.run{color:var(--ink)}.acts li.run i{background:var(--orange);box-shadow:0 0 6px var(--orange)}
.acts li .d{margin-left:auto;color:var(--dim);font-size:11px;white-space:nowrap}
.acts li span.x{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trail{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chipx{font-size:11px;padding:3px 9px;border-radius:99px;border:0;background:rgba(255,255,255,.08);color:var(--muted);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chipx.cur{background:rgba(255,192,0,.18);color:#FFE9A8}.chipx.chain{background:rgba(233,113,50,.2);color:#FFD2B8}.chipx.soft{opacity:.7}
.sessions{display:flex;gap:5px;margin-left:auto}
.sessions button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--dim);cursor:pointer}
.sessions button.cur{background:var(--gold)}
.slist{border-bottom:1px solid var(--line);padding:6px 8px}
.srow{display:grid;grid-template-columns:10px 1fr auto 16px 16px;gap:8px;align-items:center;padding:6px 6px;border-radius:8px;cursor:pointer}
.srow.cur{background:rgba(255,255,255,.07)}
.srow i{width:8px;height:8px;border-radius:50%}
.srow .nm{font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .nm small{font-weight:400;color:var(--dim);margin-left:6px}
.srow .stt{font-size:11px;color:var(--muted);white-space:nowrap}
.srow .stt.act{color:var(--orange)}.srow .stt.think{color:var(--gold)}
.srow .x{border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:14px;line-height:1;padding:0;border-radius:4px}
.srow .bar{grid-column:2/5;height:3px}
@media (hover:hover){.srow:hover{background:rgba(255,255,255,.05)}.srow .x:hover{color:var(--ink)}}
.followb{margin-left:auto;font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line2);border-radius:99px;background:transparent;color:var(--muted);padding:2px 8px;cursor:pointer}
.followb.pin{background:rgba(255,255,255,.14);color:var(--ink)}
.app .top{padding-left:86px}
.top{cursor:default}
body.focus .mission,body.focus .panel,body.focus .zoom{opacity:0;pointer-events:none}
.hrow{display:grid;grid-template-columns:8px 1fr auto;gap:9px;align-items:center;padding:9px 10px;border-radius:9px;cursor:pointer}
.hrow i{width:8px;height:8px;border-radius:50%}
.dialog.files{width:min(1280px,96vw);height:88vh;max-height:88vh}
.dialog.files header .in{flex:1}
.fwrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(240px,330px) 1fr}
.ftree{overflow:auto;border-right:1px solid var(--line);padding:8px 6px;scrollbar-width:none}.ftree::-webkit-scrollbar{display:none}
.frow{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.frow .tw{width:10px;color:var(--dim);font-size:10px;flex:none}.frow .nm{flex:1;overflow:hidden;text-overflow:ellipsis}.frow .ct{color:var(--dim);font-size:10.5px;font-variant-numeric:tabular-nums}
.frow.d .nm{font-weight:600}.frow.dim .nm{color:var(--dim)}.frow.on{background:rgba(142,169,219,.22)}.frow.sel{background:rgba(255,255,255,.05)}
.frow.hit .nm small{display:block;color:var(--dim);font-size:10.5px;font-weight:400;overflow:hidden;text-overflow:ellipsis}
@media (hover:hover){.frow:hover{background:rgba(255,255,255,.07)}}
.fnone{color:var(--dim);font-size:12px;padding:10px}
.fedit{display:flex;flex-direction:column;min-width:0;min-height:0;padding:10px 14px 12px}
.fhead{display:flex;align-items:center;gap:10px;min-height:28px}.fhead .mono{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fhead .note{color:var(--gold);font-size:11.5px}
.fwhy{color:var(--muted);font-size:11.5px;margin:2px 0 8px;min-height:14px}
.fedit textarea.code{flex:1;min-height:0;resize:none;scrollbar-width:thin}
.fedit textarea.code[readonly]{background:rgba(17,26,64,.55)}
@media (max-width:760px){.fwrap{grid-template-columns:1fr;grid-template-rows:38% 1fr}.ftree{border-right:0;border-bottom:1px solid var(--line)}}
.bstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px}
.bstat{background:rgba(255,255,255,.045);border-radius:10px;padding:10px 12px}
.bstat b{display:block;font:650 22px var(--font);font-variant-numeric:tabular-nums}.bstat span{color:var(--muted);font-size:11.5px}
.bstat.hot b{color:var(--orange)}
.brief .hrow.static{cursor:default}.brief .hrow .b{white-space:normal}
.brief .empty{color:var(--dim);font-size:12px;padding:6px 10px}
@media (max-width:560px){.bstats{grid-template-columns:repeat(2,1fr)}}
.uchip{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}.uchip:empty{display:none}.uchip.hot{color:var(--orange)}
.utabs{display:flex;gap:2px;padding:2px;border-radius:9px;background:rgba(255,255,255,.05)}.utabs .btn{height:26px;border-color:transparent;background:none;color:var(--muted)}.utabs .btn.on{background:rgba(255,255,255,.1);color:var(--ink)}
.bstat small{display:block;color:var(--dim);font-size:11px;margin-top:2px;font-variant-numeric:tabular-nums}
.uchart{margin-top:4px}.uchart svg{display:block;width:100%;height:auto;overflow:visible}.uchart rect{transition:opacity 140ms ease}.uchart g:hover rect{opacity:.75}
.ulegend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:11px;margin-top:6px}.ulegend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.ucols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}@media (max-width:700px){.ucols{grid-template-columns:1fr}}
.uline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--muted);font-size:12px}.uline .in{width:90px;height:28px}
.hrow .share{grid-column:2/4;height:3px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}.hrow .share>i{display:block;height:100%;width:0;border-radius:2px}
.hrow .a{font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .b{grid-column:2/4;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .c{color:var(--dim);font-size:11px;white-space:nowrap}
@media (hover:hover){.hrow:hover{background:rgba(255,255,255,.06)}}
.srow .stt.wait{color:#FF9D9D;font-weight:700}
.orb.wait{background:radial-gradient(circle at 35% 30%,#fff 0,#FFB3B3 22%,#FF6B6B 46%,rgba(255,107,107,0) 72%);animation:breathe 1s ease-in-out infinite}
.now .t.wait{color:#FF9D9D}
.acts li.fail i{background:var(--bad)}.acts li.fail{color:#FFC9C9}
.stools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hc{display:grid;grid-template-columns:8px 1fr;gap:8px;align-items:baseline;padding:3px 0;font-size:12px}
.hc i{width:7px;height:7px;border-radius:50%;background:var(--ok)}.hc i.no{background:var(--bad)}
.hc small{display:block;color:var(--dim);font-size:11px}
.hfilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.hf{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;border:0;background:rgba(255,255,255,.07);color:var(--muted);font-size:12px;cursor:pointer}
.hf.on{background:rgba(255,255,255,.18);color:var(--ink);font-weight:600}.hf i{width:7px;height:7px;border-radius:50%}
.hstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.hstats div{background:rgba(255,255,255,.06);border-radius:8px;padding:8px 10px}.hstats b{display:block;font-size:18px;font-weight:600}.hstats span{font-size:11px;color:var(--muted)}
.hreq.open{background:rgba(255,255,255,.04);border-radius:10px;margin:2px 0}
.hdet{padding:2px 12px 12px 27px}
.hl{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:3px 0;font-size:12px;color:#D5DCF3}
.hl .o{color:var(--dim);font-variant-numeric:tabular-nums}.hl .d{color:var(--dim);font-size:11px;white-space:nowrap}
.hl .x{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl.fail .x,.hl.fail .d{color:#FFB3B3}.hl.wait .x{color:#FFD9A8}.hl.end .x{color:var(--ok)}
.caps.tg{cursor:pointer;display:flex;align-items:center;gap:5px;user-select:none;border-radius:5px;margin-left:-4px;padding:2px 4px}
.caps.tg::before{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--dim);transition:transform 140ms var(--ease-out)}
.caps.tg.closed::before{transform:rotate(-90deg)}
.caps.tg .cc{margin-left:auto;font-weight:500;color:var(--dim)}
@media (hover:hover){.caps.tg:hover{background:rgba(255,255,255,.05)}}
.mcol{margin-left:6px;width:24px;padding:0}
.mission.min .slist,.mission.min .body{display:none!important}
.mission.min header{border-bottom:0}
.msum{margin-left:8px;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aud{background:rgba(255,255,255,.05);border-radius:10px;padding:10px 12px;margin-bottom:16px}
.aud .al{display:flex;gap:8px;padding:3px 0;font-size:12.5px}.aud .al b{min-width:22px;text-align:right;font-weight:600}
.aud .al.bad b{color:#FFB3B3}.aud .al.zero{color:var(--dim)}
.hintline{color:var(--dim);font-size:12px;margin-top:10px}

/* right panel: details and reader */
.panel{position:fixed;right:14px;top:68px;bottom:14px;width:400px;display:flex;flex-direction:column;z-index:4;transform:translateX(calc(100% + 20px));transition:transform 320ms var(--ease-drawer);overflow:hidden}
.panel.on{transform:none}
.panel>header{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 10px;border-bottom:1px solid var(--line)}
.tab{height:26px;padding:0 10px;border-radius:7px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:12px;cursor:pointer}
.tab[aria-selected="true"]{background:rgba(255,255,255,.08);color:var(--ink)}
.tab .live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:6px;box-shadow:0 0 8px var(--gold)}
.pbody{flex:1;overflow:auto;user-select:text;-webkit-user-select:text}
.pad{padding:16px 16px 22px}
.kind{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kind i{width:8px;height:8px;border-radius:50%}
.pad h2{font:650 18px/1.25 var(--font);margin:8px 0 2px;word-break:break-word}
.mono{font:11px/1.45 var(--mono);color:var(--dim);word-break:break-all}
.desc{margin:10px 0 12px;color:#D5DCF3;white-space:pre-wrap}
.acts2{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 2px}
.why{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted);margin-top:10px}
.sec{margin-top:18px}
.sec .caps{display:flex;margin:0 0 6px}.sec .caps .c{margin-left:auto;letter-spacing:0;font-weight:500}
.steps{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.steps li{display:flex;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.steps li:last-child{border-bottom:0}
.steps b{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#1A0B02;font-size:11px;flex:none}
.item{display:flex;gap:9px;align-items:center;padding:6px 6px;border-radius:6px;cursor:pointer}
.item i{width:7px;height:7px;border-radius:50%;flex:none}
.item .k{margin-left:auto;color:var(--dim);font-size:11px}
@media (hover:hover){.item:hover,.steps li:hover{background:rgba(255,255,255,.05)}}
.rule{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.rule code{flex:1;font:11px/1.45 var(--mono);word-break:break-all;color:#C9D3F0}
.rule .ch{color:var(--orange);font-weight:700}
.help{font-size:12px;color:var(--dim)}
/* reader */
.rhead{padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.rhead .st{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:7px}
.rhead .st.done{color:var(--ok)}
.rhead h3{font:650 15px/1.3 var(--font);margin:4px 0 2px}
.rhead .bar{margin-top:9px}
.doc{padding:12px 16px 40px;font:12.5px/1.6 var(--font)}
.doc div{opacity:.22;transition:opacity 260ms ease;white-space:pre-wrap;word-break:break-word;min-height:.6em;border-left:2px solid transparent;padding-left:8px;margin-left:-10px}
.doc div.rd{opacity:1}
.doc div.at{background:linear-gradient(90deg,rgba(255,192,0,.14),rgba(255,192,0,0) 75%)}
.doc .h{font-weight:650;font-size:14px;color:#fff;margin-top:8px}
.doc .fm,.doc .cd{font:11.5px/1.55 var(--mono);color:#A9B6DC}
.doc code{font:11.5px var(--mono);background:rgba(255,255,255,.07);padding:1px 4px;border-radius:4px}
.empty{padding:26px 18px;color:var(--muted)}

/* overlays */

  return `<svg viewBox="0 -12 ${W} ${H + 30}" role="img" aria-label="Daily cost, last 30 days"><line x1="0" x2="${W}" y1="4" y2="4" stroke="rgba(255,255,255,.08)" stroke-dasharray="2 4"/><text x="${W}" y="-2" text-anchor="end" fill="var(--dim)" font-size="10">${money(max)}</text>${bars}
    <text x="0" y="${H + 14}" fill="var(--dim)" font-size="10">${esc(lab(daily[0].day))}</text><text x="${W / 2}" y="${H + 14}" text-anchor="middle" fill="var(--dim)" font-size="10">${esc(lab(daily[Math.floor(n / 2)].day))}</text><text x="${W}" y="${H + 14}" text-anchor="end" fill="var(--dim)" font-size="10">Today</text></svg>`;
}
async function usageDialog(days = usageDays) {

    <div class="bstats">

    </div>

      <div class="ulegend">${fams.filter((f) => UFAM[f]).map((f) => `<span><i style="background:${UFAM[f][1]}"></i>${UFAM[f][0]}</span>`).join('')}<span style="margin-left:auto">Cache reads are ${Math.round(r.cache.readShare * 100)}% of input (${rangeWord}); caching saved about ${money(r.cache.saved)}</span></div></div>
    <div class="ucols">
      ${sec('By model, ' + rangeWord, money(r.range.cost), r.models.map((m) => row(modelName(m.key), `${pct(m.cost)} · ${toks(m.output)} output, ${toks(m.cacheRead)} cache read${m.priced ? '' : ' · no published price'}`, money(m.cost), UFAM[m.family][1], m.cost / total)).join(''), 'No usage in this range.')}

async function loadFeedback() { if (!LIVE) return; let r; try { r = await api('GET', '/api/feedback'); } catch { return; } const box = $('#fbBox'); if (!box) return; const open = r.items.filter((x) => x.status !== 'resolved');

// ---------- palette (keyboard-first: no animation) ----------
let palItems = [], palSel = 0;
function openPalette() { openDialog(`<input id="pq" placeholder="Search skills, chains, notes, or type a command" autocomplete="off" spellcheck="false"><ul id="pl"></ul>`, { cls: 'palette', anim: false }); const q = $('#pq'); q.focus(); q.oninput = () => { palSel = 0; renderPalette(q.value); }; renderPalette('');
  q.onkeydown = (e) => { if (e.key === 'ArrowDown') { e.preventDefault(); palSel = Math.min(palItems.length - 1, palSel + 1); paintSel(); } else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(0, palSel - 1); paintSel(); } else if (e.key === 'Enter') { e.preventDefault(); palItems[palSel]?.run(); } else if (e.key === 'Escape') closeDialog(); }; }
const CMDS = () => [{ label: 'Fit everything in view', k: 'F', run: () => fit() }, { label: 'Replay last request', k: 'R', run: () => replay() }, { label: 'Show request history', k: 'H', run: () => showPanel('H') }, { label: 'Hide or show panels', k: '\\', run: () => document.body.classList.toggle('focus') }, { label: 'Expand all groups', run: () => $('#expandAll').click() }, { label: 'Collapse groups', run: () => $('#collapseAll').click() }, ...(LIVE ? [{ label: 'New skill', run: newSkillDialog }] : []), { label: 'Reset layout', run: () => $('#resetLayout').click() }];
function renderPalette(raw) {
  const q = raw.trim().toLowerCase(), words = q.split(/\s+/).filter(Boolean);
  const ns = (n) => { if (!words.length) return (n.type === 'chain' ? 3 : 0) + Math.min(10, n.links || 0); const name = `${n.label} ${n.native || ''}`.toLowerCase(), desc = (n.desc || '').toLowerCase(); let s = 0; for (const w of words) { const i = name.indexOf(w); if (i === 0) s += 40; else if (i > 0) s += 25; else if (desc.includes(w)) s += 6; else return 0; } return s + (name.startsWith(q) ? 30 : 0) + (['chain', 'escalon', 'own'].includes(n.type) ? 3 : 0); };
  const nh = nodes.map((n) => ({ n, s: ns(n) })).filter((x) => x.s > 0).sort((a, b) => b.s - a.s).slice(0, q ? 12 : 7), ch = CMDS().filter((c) => !q || c.label.toLowerCase().includes(q));
  palItems = [...nh.map(({ n }) => ({ html: `<i style="background:${kc(n.type)}"></i><span>${esc(n.label)}</span><span class="k">${esc(KINDS[n.type]?.label || '')}</span>`, run: () => { closeDialog(); reveal(n); select(n); setTimeout(() => zoomTo(n), 80); } })), ...ch.map((c) => ({ html: `<span>${esc(c.label)}</span><span class="k">${c.k ? `<kbd>${c.k}</kbd>` : 'Command'}</span>`, run: () => { closeDialog(); c.run(); } }))];
  const ul = $('#pl'); if (!ul) return; const nN = nh.length;
  ul.innerHTML = palItems.map((it, i) => `${i === 0 && nN ? '<li class="grp" aria-hidden="true">Graph</li>' : ''}${i === nN && palItems.length > nN ? '<li class="grp" aria-hidden="true">Commands</li>' : ''}<li data-i="${i}" aria-selected="${i === palSel}">${it.html}</li>`).join('') || '<li class="grp">No matches</li>';
  ul.querySelectorAll('li[data-i]').forEach((li) => { li.onmousemove = () => { if (palSel !== Number(li.dataset.i)) { palSel = Number(li.dataset.i); paintSel(); } }; li.onclick = () => palItems[li.dataset.i].run(); });
}
function paintSel() { document.querySelectorAll('#pl li[data-i]').forEach((li) => li.setAttribute('aria-selected', String(Number(li.dataset.i) === palSel))); document.querySelector(`#pl li[data-i="${palSel}"]`)?.scrollIntoView({ block: 'nearest' }); }
$('#openPalette').onclick = openPalette;
addEventListener('keydown', (e) => {
  if (scrim.classList.contains('on')) { if (e.key === 'Escape' && !$('#dText')) closeDialog(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '') || e.metaKey || e.ctrlKey) return;
  if (e.key === '/') { e.preventDefault(); openPalette(); } else if (e.key === 'f') fit(); else if (e.key === 'r') replay(); else if (e.key === 'h') showPanel('H'); else if (e.key === 'b') briefDialog(); else if (e.key === 'u') usageDialog(); else if (e.key === 'o') filesDialog(); else if (e.key === '\\') document.body.classList.toggle('focus'); else if (/^[1-9]$/.test(e.key)) { const x = [...sessions.values()].filter((y) => !y.hidden)[Number(e.key) - 1]; if (x) watch(x.id, true); } else if (e.key === 'e' && focus) $('#editBtn')?.click(); else if (e.key === 'Escape') { $('#pop').classList.remove('on'); select(null); }
});

// ---------- view menu ----------
function renderLayers() { $('#layers').innerHTML = Object.entries(KINDS).map(([t, K]) => { const n = nodes.filter((x) => x.type === t).length; return n ? `<div class="layer${hiddenKinds.has(t) ? ' off' : ''}" data-t="${t}" role="checkbox" aria-checked="${!hiddenKinds.has(t)}" tabindex="0"><i style="background:${K.ring ? 'transparent' : K.c};${K.ring ? 'border:1.5px solid ' + K.c : ''}"></i><span>${K.label}</span><span class="n">${n}</span></div>` : ''; }).join('');
  document.querySelectorAll('.layer').forEach((el) => { const tg = () => { const t = el.dataset.t; hiddenKinds.has(t) ? hiddenKinds.delete(t) : hiddenKinds.add(t); store.set('hidden', [...hiddenKinds]); renderLayers(); restartSim(0.25); }; el.onclick = tg; el.onkeydown = (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tg(); } }; }); }
$('#pop').insertAdjacentHTML('beforeend', '<div class="caps">Harness health</div><div id="health" class="help">Open the app to check.</div><div class="row" style="margin-top:8px"><button class="btn sm" id="runTests">Run routing tests</button></div><div id="backlog"></div>');
async function loadHealth() { if (!LIVE) return; try { const h = await api('GET', '/api/health'); $('#health').innerHTML = h.checks.map((c) => `<div class="hc"><i class="${c.pass ? '' : 'no'}"></i><span>${esc(c.name)}<small>${esc(c.detail)}</small></span></div>`).join(''); $('#backlog').innerHTML = h.backlog.length ? `<div class="caps">Backlog (${h.backlog.length})</div>${h.backlog.slice(0, 6).map((b) => `<div class="help" style="padding:2px 0">· ${esc(b)}</div>`).join('')}` : ''; } catch (e) { $('#health').textContent = e.message; } }

$('#viewBtn').onclick = (e) => { e.stopPropagation(); $('#pop').classList.toggle('on'); if ($('#pop').classList.contains('on')) loadHealth(); };

$('#replay').onclick = () => { $('#pop').classList.remove('on'); replay(); };
$('#pop').insertAdjacentHTML('beforeend', '<div class="caps">Shortcuts</div><div class="help">/ search · F fit · R replay · H history · 1-9 switch session · \\ hide panels · E edit · Esc clear</div>');
$('#newSkill').onclick = newSkillDialog;
$('#improveBtn').onclick = () => feedbackDialog(); $('#briefBtn').onclick = briefDialog; $('#usageBtn').onclick = () => usageDialog(); $('#filesBtn').onclick = () => filesDialog(); loadAlertSetting();

let replaying = 0;
function replay(at0) { // re-run a request's events with their real spacing, compressed
  let i = Number.isInteger(at0) ? at0 : rawEvents.length - 1; while (i >= 0 && rawEvents[i].t !== 'route') i--; if (i < 0) return toast('Nothing to replay yet.');
  let evs = rawEvents.slice(i).filter((e) => e.session === rawEvents[i].session); const nx = evs.findIndex((e, k) => k > 0 && e.t === 'route'); if (nx > 0) evs = evs.slice(0, nx); evs = evs.slice(0, 120); pinUntil = 0; const tok = ++replaying; let at = 0, prev = evs[0].ts || 0;
  evs.forEach((ev) => { at += clamp(((ev.ts || prev) - prev) / 4, 60, 1500); prev = ev.ts || prev; setTimeout(() => { if (tok === replaying) { const keep = rawEvents.length; handle(ev); rawEvents.length = keep; } }, at); });
  toast(`Replaying ${evs.length} events.`);
}

// ---------- live connection ----------
function connect() {
  const st = $('#status'), tx = $('#statusText');
  if (!LIVE) { tx.textContent = 'Read only'; $('#newSkill').style.display = 'none'; $('#improveBtn').style.display = 'none'; $('#briefBtn').style.display = 'none'; $('#usageBtn').style.display = 'none'; $('#filesBtn').style.display = 'none'; renderMission(); return; }
  refreshUsageChip(); setInterval(refreshUsageChip, 120e3);
  setTimeout(() => { let seen = ''; try { seen = localStorage.getItem('briefDay') || ''; } catch {} if (seen !== new Date().toDateString() && !scrim.classList.contains('on')) briefDialog(); }, 1500);
  const es = new EventSource('/api/events?t=' + encodeURIComponent(TOKEN));
  es.onopen = () => { st.className = 'status on'; tx.textContent = 'Live'; };
  es.onerror = () => { st.className = 'status'; tx.textContent = 'Reconnecting'; fetch('/api/data', { headers: { 'X-Brain-Token': TOKEN } }).then((r) => { if (r.status === 403) location.reload(); }).catch(() => {}); };
  es.onmessage = async (m) => { let ev; try { ev = JSON.parse(m.data); } catch { return; }
    if (ev.type === 'activity') ev.events.forEach((a) => handle(a));
    else if (ev.type === 'alert') { toast(ev.alert.title + ': ' + ev.alert.body, 'bad'); native({ attention: 1 }); if (ev.alert.kind === 'usage') refreshUsageChip(); }
    else if (ev.type === 'indexing') { st.className = 'status on busy'; tx.textContent = 'Reindexing'; }
    else if (ev.type === 'files') { st.className = 'status on'; tx.textContent = 'Live'; await refresh(); for (const p of ev.paths) { const n = nodeForPath(p); if (n) { fire(n, 8000, 0.8); if (focus === n) renderDetails(); } } } };
  api('GET', '/api/activity?n=5000').then((r) => { r.events.forEach((a) => { rawEvents.push(a); handle(a, true); }); for (const x of sessions.values()) if (Date.now() - x.lastEv > 120000) { x.state = 'idle'; x.running.clear(); } const top = [...sessions.values()].sort((a, b) => b.lastEv - a.lastEv)[0]; loadNames(); if (top) { activeSess = top.id; current = top.node; if (current) fire(current, 20000, 0.7); } renderMission(); }).catch(() => renderMission());
}

requestAnimationFrame(() => { if (cam) sel.call(zoom.transform, d3.zoomIdentity.translate(cam[0], cam[1]).scale(cam[2])); else { sim.tick(260); fit(null, 0); } kick(); });
connect();
